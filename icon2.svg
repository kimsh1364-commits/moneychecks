  <circle cx="97"  cy="326" r="9" fill="#a78bfa" opacity="0.6"/>
  <circle cx="154" cy="281" r="9" fill="#a78bfa" opacity="0.7"/>
  <circle cx="218" cy="302" r="9" fill="#a78bfa" opacity="0.7"/>
  <circle cx="286" cy="225" r="9" fill="#c4b5fd" opacity="0.85"/>
  <circle cx="354" cy="184" r="9" fill="#ddd6fe" opacity="0.9"/>
  <circle cx="415" cy="154" r="14" fill="#f5f3ff" filter="url(#softglow)"/>
  <circle cx="415" cy="154" r="6.5" fill="#7c3aed"/>
  <rect x="97"  y="338" width="77" height="31" rx="15" fill="rgba(255,255,255,0.08)"/>
