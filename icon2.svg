  <rect x="72" y="128" width="368" height="266" rx="41" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <path d="M97,326 L154,281 L218,302 L286,225 L354,184 L415,154 L415,354 L97,354 Z"
